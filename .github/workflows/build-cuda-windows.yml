name: CI (CUDA, windows)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  actions: write
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  cuda:
    name: windows-cuda-l40s-epyc (${{ matrix.cuda }}, ${{ matrix.arch }})
    runs-on: windows-2022

    strategy:
      matrix:
        include:
          - cuda: '13.4'
            arch: x64
            defines: '-DGGML_CUDA_CCCL_VERSION=v3.4.3'

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda }}
          cuda_arch: ${{ matrix.arch }}

      - name: Install Ninja
        id: install_ninja
        run: |
          choco install ninja

      - name: Build L40S CUDA + EPYC Zen5 CPU + Server
        id: cmake_build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=ON ^
            -DGGML_AVX=ON ^
            -DGGML_AVX2=ON ^
            -DGGML_FMA=ON ^
            -DGGML_F16C=ON ^
            -DGGML_AVX512=ON ^
            -DGGML_AVX512_VBMI=ON ^
            -DGGML_AVX512_VNNI=ON ^
            -DGGML_AVX512_BF16=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_QUANTS=all ^
            -DCMAKE_CUDA_ARCHITECTURES="89" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_COMMON=ON ^
            -DLLAMA_OPENSSL=OFF ^
            ${{ matrix.defines }}
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target llama-server llama-cli llama-quantize ggml-cuda ggml-cpu

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-win-cuda13-l40s-epyc-avx512
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll
          if-no-files-found: error
